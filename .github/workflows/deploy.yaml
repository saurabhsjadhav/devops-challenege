name: Build, Push, Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/devops-challenge-app

  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: ci-cluster

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/redis.yaml
          sed 's|latest|${{ github.sha }}|' k8s/app-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/app-service.yaml
          kubectl -n challenge rollout status deployment/devops-app --timeout=90s

      - name: Debug on failure
        if: failure()
        run: |
          echo "----- PODS -----"
          kubectl -n challenge get pods -o wide
          echo "----- DESCRIBE PODS -----"
          kubectl -n challenge describe pods
          echo "----- APP LOGS -----"
          kubectl -n challenge logs -l app=devops-app --all-containers --tail=100 || true
          echo "----- REDIS LOGS -----"
          kubectl -n challenge logs -l app=redis --all-containers --tail=100 || true

      - name: Smoke test
        run: |
          kubectl -n challenge port-forward svc/devops-app 3000:3000 &
          sleep 5
          curl -sf http://localhost:3000/readyz