apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: challenge
spec:
  replicas: 2
  selector:
    matchLabels: { app: devops-app }
  template:
    metadata:
      labels: { app: devops-app }
    spec:
      containers:
      
        - name: devops-app
          image: ghcr.io/saurabhsjadhav/devops-challenge-app:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: app-config }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3